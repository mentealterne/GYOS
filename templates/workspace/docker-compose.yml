# Postgres for development and for the integration tests: docker compose up -d
#
# One server, two databases: "product" for pnpm dev (DATABASE_URL) and "product_test" for the
# integration tests (TEST_DATABASE_URL), which they may wipe. The second one is created on the
# first start by docker/postgres/create-test-database.sh, named after POSTGRES_DB. See
# .env.example for the URLs.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    ports:
      - "5432:5432"
    volumes:
      # From Postgres 18, the image keeps its data under /var/lib/postgresql/18/docker, and the
      # volume goes on /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      # Runs only when the data volume is empty: on the first start, or after docker compose down -v.
      - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      # Over TCP: while the init script runs, the image's temporary server listens only on its
      # Unix socket, so the check passes once the real server is up, with both databases.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d product"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
