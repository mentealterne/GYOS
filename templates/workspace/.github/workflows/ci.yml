name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A throwaway Postgres for the integration tests. Its database is named for tests: the tests
      # refuse any other, and create and drop databases next to it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: product_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d product_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The Node major the product runs on; package.json engines says the same.
          node-version: 24
          cache: pnpm
      # Needs a committed pnpm-lock.yaml: --frozen-lockfile fails without one. GYOS's templates ship
      # none, because the module names vary; commit the one the first `pnpm install` writes.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Every module's migrations folder is consistent (drizzle-kit check).
      - run: pnpm db:check
      - run: pnpm test:unit
      - run: pnpm test:scenarios
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/product_test
      # GYOS's conformance checks, once the product has them.
      - name: GYOS doctor
        if: hashFiles('scripts/gyos-doctor.ts') != ''
        run: node scripts/gyos-doctor.ts
