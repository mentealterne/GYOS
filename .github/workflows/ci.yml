name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Marketplace and plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.332 plugin validate --strict .
      - name: Plugin manifest
        run: npx --yes @anthropic-ai/claude-code@2.1.332 plugin validate --strict .claude-plugin/plugin.json

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-links.ts
