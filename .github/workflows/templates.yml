name: Templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-templates:
    name: Verify templates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A superuser on a throwaway server: the verification creates and drops its own database,
      # gyos_verify_<time>_<pid>, and gives it to the integration tests as TEST_DATABASE_URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # The version a generated product pins.
          package_json_file: templates/workspace/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --version && pnpm --version
      - run: node scripts/verify-templates.ts
